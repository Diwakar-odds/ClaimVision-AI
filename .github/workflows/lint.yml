name: Code Quality

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  lint:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: code

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Black
        run: black --check .

      - name: Run Ruff
        run: ruff check .

      - name: Check Formatting
        run: black --check .

      - name: Run Ruff
        run: ruff check .